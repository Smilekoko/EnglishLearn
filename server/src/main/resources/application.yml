server:
  port: 8080

spring:
  application:
    name: englishlearn-server

  datasource:
    # 数据库需先创建：db/init.sql
    url: ${DB_URL:jdbc:mysql://localhost:3306/englishlearn?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    # 本机开发默认密码；其他环境用环境变量 DB_PASSWORD 覆盖
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect

logging:
  level:
    org.hibernate.SQL: info
