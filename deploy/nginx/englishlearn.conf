# /etc/nginx/conf.d/englishlearn.conf
# 把 example.com 换成你的域名；证书路径由 certbot 生成

server {
    listen 80;
    server_name example.com;

    # 申请证书时 certbot 需要 80 端口，其余请求跳转到 https
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 24.04 自带 nginx 1.24，用这种写法；1.25+ 可改成 listen 443 ssl; + http2 on;
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 前端产物
    root /var/www/englishlearn/webReact;
    index index.html;

    # 用户端（HashRouter，兜底回 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理端（构建时 base=/admin/）
    location /admin/ {
        alias /var/www/englishlearn/webAdmin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存（带 hash 的文件可以长缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|mp3|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 不暴露源码
    location ~ /\.(?!well-known) {
        deny all;
    }
}
